services:
  - type: web
    name: grand-horizon-hotel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: MONGODB_DB_NAME
        value: grand_horizon_hotel
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
